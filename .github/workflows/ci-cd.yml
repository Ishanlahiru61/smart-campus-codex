name: Smart Campus CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend:
    name: Backend – Build & Test (Unit + Integration)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up JDK 17 with Maven cache
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Run all tests (unit + integration) — no Docker needed.
      #    Flapdoodle Embedded MongoDB starts automatically from the classpath.
      - name: Run All Tests
        run: mvn -f backend/pom.xml clean verify
        env:
          # Provide dummy values so the app context can start without real secrets.
          # The real values are only needed at runtime, not during testing.
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-key-for-ci-cd-pipeline-only-32chars
          JWT_EXPIRATION: 86400000
          APP_ENCRYPTION_KEY: test-encryption-key-for-ci-16byte
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: dummy
          CLOUDINARY_API_SECRET: dummy
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 25
          SPRING_MAIL_USERNAME: test@test.com
          SPRING_MAIL_PASSWORD: dummy
          FRONTEND_URL: http://localhost:5173

      # 4. Upload test reports as artifacts for inspection
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
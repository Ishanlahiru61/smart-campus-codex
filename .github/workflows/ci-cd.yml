name: Smart Campus CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Backend – Build, Unit Tests, Integration Tests, Coverage
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend – Build & Test
    runs-on: ubuntu-latest

#    services:
#      mongo:
#        image: mongo:6
#        ports:
#          - 27017:27017

    steps:
      
      - name: Checkout Code
        uses: actions/checkout@v4

      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

     
      - name: Build Backend (Skipping Tests)
        run: mvn -f backend/pom.xml clean install -DskipTests
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/test
          SPRING_MONGODB_EMBEDDED_ENABLED: false
          JWT_SECRET: test-secret-key-for-ci-cd-pipeline-only-32chars
          JWT_EXPIRATION: 86400000
          APP_ENCRYPTION_KEY: test-encryption-key-for-ci-16byte
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: dummy
          CLOUDINARY_API_SECRET: dummy
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 25
          SPRING_MAIL_USERNAME: test@test.com
          SPRING_MAIL_PASSWORD: dummy
          FRONTEND_URL: http://localhost:5173

      # 4. Upload Surefire (unit/integration) test reports
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      # 5. Upload JaCoCo HTML coverage report
      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14


  frontend:
    name: Frontend – Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8081
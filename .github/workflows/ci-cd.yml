name: Smart Campus CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Backend CI (Build + Test + Coverage)
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend CI (Build + Test + Coverage)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: mvn -f backend/pom.xml clean verify
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/test
          SPRING_PROFILES_ACTIVE: test
          # Secrets and other config for CI environment
          JWT_SECRET: test-secret-key-for-ci-cd-pipeline-only-32chars
          JWT_EXPIRATION: 86400000
          APP_ENCRYPTION_KEY: test-encryption-key-for-ci-16byte
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: dummy
          CLOUDINARY_API_SECRET: dummy
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 25
          SPRING_MAIL_USERNAME: test@test.com
          SPRING_MAIL_PASSWORD: dummy
          FRONTEND_URL: http://localhost:5173

      - name: Print test logs on failure
        if: failure()
        run: cat backend/target/surefire-reports/*.txt || true

      - name: Enforce Coverage Gate
        run: mvn -f backend/pom.xml jacoco:check

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/target/surefire-reports/

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Frontend CI (Build Check)
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend CI (Build Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build project
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8081
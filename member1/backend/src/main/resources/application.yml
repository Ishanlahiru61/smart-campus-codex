spring:
  application:
    name: smart-campus-facilities-api
  
  data:
    mongodb:
      uri: "${MONGODB_URI:mongodb://localhost:27017/smartcampus}"
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${API_PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.smartcampus: DEBUG

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-super-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}
